# Archive Synapse, sign it automatically with the App Store Connect API key and upload it to TestFlight.
# Secrets: ASC_KEY_P8 (contents of AuthKey_XXXX.p8), ASC_KEY_ID, ASC_ISSUER_ID.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect / TestFlight (false: archive only)"
        type: boolean
        default: true
      runner:
        description: "GitHub macOS image (Xcode 27 is on the xcode-27 image)"
        type: string
        default: xcode-27
      xcode:
        description: "Xcode major version (27 = iOS 27 SDK, required for uploads from April 2027, ITMS-90725)"
        type: string
        default: "27"
  push:
    tags: ["v*"]

concurrency: testflight

jobs:
  testflight:
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 60
    env:
      TEAM_ID: BXQW8UBNM2
      KEY_PATH: ${{ github.workspace }}/../asc/AuthKey.p8
      XCODE_MAJOR: ${{ inputs.xcode || '27' }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode ${{ inputs.xcode || '27' }} (newest SDK App Store Connect accepts)
        run: |
          X=$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -z "$X" ]; then echo "no Xcode $XCODE_MAJOR on this image"; ls /Applications | grep -i xcode; sw_vers; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
          # App Store Connect rejects binaries from beta Xcode builds (their build number ends in a letter, e.g. 27A5218g)
          if xcodebuild -version | tail -1 | grep -qE "[0-9][a-z]$"; then echo "only a beta Xcode $XCODE_MAJOR here; App Store uploads need a release build"; exit 1; fi

      - name: Generate the Xcode project
        run: |
          which xcodegen || brew install xcodegen
          scripts/fetch-ish.sh
          xcodegen generate

      - name: Metal toolchain (MLX compiles its shaders)
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain already installed or unavailable"

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Archive (Release, signed automatically)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Synapse.xcodeproj -scheme Synapse -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Synapse.xcarchive" \
            -allowProvisioningUpdates -skipPackagePluginValidation -skipMacroValidation \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E --line-buffered 'error:|warning: .*(sign|provision)|\*\* ARCHIVE|Signing Identity|Provisioning Profile' || true
          test -d "$RUNNER_TEMP/Synapse.xcarchive" || { tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Upload to App Store Connect (TestFlight)
        if: ${{ github.event_name == 'push' || inputs.upload }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><true/>
            <key>uploadSymbols</key><true/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Synapse.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | tail -40

      - name: Logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore

      - name: Key off the machine
        if: always()
        run: rm -f "$KEY_PATH"
