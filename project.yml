# XcodeGen spec — `xcodegen generate` writes Synapse.xcodeproj (generated in CI, not committed).
name: Synapse
options:
  bundleIdPrefix: com.everaldtah
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: BXQW8UBNM2
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  SynapseKit:
    path: SynapseKit
  # On-device open-weights models (MLX). mlx-swift 0.31.5+ needs Xcode 26.4 (Swift 6.3); CI's macos-15 has 26.3,
  # so these stay on the last releases that build there.
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 1.0.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5

schemes:
  Synapse:
    build:
      targets:
        Synapse: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Synapse:
    type: application
    platform: iOS
    sources:
      - path: Synapse
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: SynapseKit
      - package: mlx-swift
        product: MLX
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everaldtah.synapse
        PRODUCT_NAME: Synapse
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_EMIT_LOC_STRINGS: NO
    info:
      path: Synapse/Info.plist
      properties:
        CFBundleDisplayName: Synapse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.everaldtah.synapse
            CFBundleURLSchemes: [synapse]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Synapse uses the camera to scan the pairing QR code shown by Synapse Bridge, and to take photos for your pages.
        NSLocalNetworkUsageDescription: Synapse connects to Synapse Bridge on your computer so complex AI tasks can run on your own Claude or ChatGPT subscription.
        NSMicrophoneUsageDescription: Synapse records meetings and voice notes, and transcribes them on this iPhone.
        NSSpeechRecognitionUsageDescription: Synapse turns your recordings into text on this iPhone with Apple's on-device speech recognition.
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
